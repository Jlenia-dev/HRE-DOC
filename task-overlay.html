<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Task — Test di usabilità</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* posizione del bottone flottante */
      --fab-top: 12px;
      --fab-left: 13.6%;
      --bg: #F3F6F7;
      --ink: #1c1f26;
      --body: #33352f;
      --gold: #c0a05a;
      --muted: #6f6a5e;
      --rule: #ddd8cc;
    }
    * { box-sizing: border-box; }
    html { font-size: 15px; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--body);
      font-family: "Jost", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- schermata istruzioni ---------- */
    .intro-wrap { display: flex; justify-content: center; padding: 4.5rem 1.5rem 5rem; }
    .intro { width: 100%; max-width: 620px; }
    .counter { font-size: 0.95rem; color: #9a9488; letter-spacing: 1px; margin: 0 0 1.6rem; }
    h1 {
      font-weight: 400;
      font-size: clamp(2.4rem, 6vw, 3.4rem);
      color: var(--ink);
      letter-spacing: 0.5px;
      margin: 0 0 2.2rem;
    }
    .scenario {
      background: #e7e9e8;
      border-radius: 0.9rem;
      padding: 1.5rem 1.6rem;
      font-size: 1.06rem;
      line-height: 1.65;
      color: #3b3d38;
      margin-bottom: 2.4rem;
    }
    .activity + .activity { border-top: 1px solid var(--rule); margin-top: 1.9rem; padding-top: 1.9rem; }
    .tag {
      display: inline-block;
      background: #e2e4e3;
      color: #6f6a5e;
      font-size: 0.72rem;
      letter-spacing: 2px;
      padding: 0.28rem 0.6rem;
      border-radius: 0.35rem;
      margin-bottom: 0.9rem;
    }
    .activity p { margin: 0; font-size: 1.06rem; line-height: 1.65; }
    strong { color: #1c1c1c; font-weight: 600; }
    .start {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      margin-top: 2.6rem;
      background: #0b0d10;
      color: #fff;
      border: 0;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1.4px;
      padding: 1.05rem 1.9rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .start:hover { background: #26292e; }
    .start:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

    /* ---------- vista test ---------- */
    #site { display: none; width: 100vw; height: 100vh; border: 0; }
    .fab { display: none; }
    body[data-view="test"] { overflow: hidden; }
    body[data-view="test"] .intro-wrap { display: none; }
    body[data-view="test"] #site { display: block; }
    body[data-view="test"] .fab { display: inline-flex; }

    .fab {
      position: fixed;
      top: var(--fab-top);
      left: var(--fab-left);
      z-index: 50;
      align-items: center;
      gap: 0.45rem;
      background: #393939;
      color: #fff;
      border: 1px solid #626262;
      border-radius: 999px;
      padding: 0.42rem 0.95rem;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }
    .fab:hover { background: #454545; }
    .fab:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    .fab svg { width: 15px; height: 15px; flex: 0 0 15px; }

    .sheet {
      position: fixed;
      top: calc(var(--fab-top) + 46px);
      left: var(--fab-left);
      z-index: 60;
      width: 380px;
      max-width: calc(100vw - 2rem);
      max-height: calc(100vh - var(--fab-top) - 72px);
      overflow-y: auto;
      background: #fff;
      border-radius: 0.9rem;
      box-shadow: 0 14px 44px rgba(0,0,0,0.24);
      padding: 1.4rem 1.5rem 1.6rem;
    }
    .sheet[hidden] { display: none; }
    .sheet-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 0.9rem; }
    .sheet .counter { font-size: 0.9rem; margin: 0; }
    .close {
      background: none;
      border: 0;
      font-size: 1.3rem;
      line-height: 1;
      color: #6f6a5e;
      cursor: pointer;
      padding: 0 0.15rem;
      border-radius: 0.3rem;
    }
    .close:hover { color: #1c1c1c; }
    .close:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .sheet h2 {
      font-weight: 400;
      font-size: 2.2rem;
      color: var(--ink);
      letter-spacing: 0.5px;
      margin: 0 0 1.3rem;
    }
    .sheet .scenario { padding: 1.1rem 1.2rem; border-radius: 0.8rem; margin-bottom: 1.5rem; }
    .sheet .activity + .activity { margin-top: 1.4rem; padding-top: 1.4rem; }
    .back {
      display: block;
      width: 100%;
      margin-top: 1.7rem;
      background: #16202c;
      color: #fff;
      border: 0;
      border-radius: 999px;
      padding: 0.95rem 1rem;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 1.6px;
      cursor: pointer;
    }
    .back:hover { background: #26313d; }
    .back:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body data-view="intro">

  <div class="intro-wrap">
    <main class="intro">
      <p class="counter" id="introCounter">1/4</p>
      <h1 id="introTitle">Task 1</h1>
      <div id="introContent"></div>
      <button class="start" id="startBtn">
        INIZIA IL TASK
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </main>
  </div>

  <iframe id="site" title="Ambiente di test"></iframe>

  <button class="fab" id="fab" aria-expanded="false" aria-controls="sheet">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/>
      <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/>
    </svg>
    Istruzioni Task
  </button>

  <div class="sheet" id="sheet" role="dialog" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-head">
      <span class="counter" id="panelCounter">1/4</span>
      <button class="close" id="closeBtn" aria-label="Chiudi le istruzioni">×</button>
    </div>
    <h2 id="sheetTitle">Task 1</h2>
    <div id="panelContent"></div>
    <button class="back" id="backBtn">TORNA AL TASK</button>
  </div>

  <script src="tasks.js"></script>
  <script>
  /* Variante A — si parte dalla schermata istruzioni; "Inizia il task"
     sostituisce le istruzioni con il sito, che resta in questa scheda
     dentro un iframe. Sopra galleggia il bottone "Istruzioni Task", che
     riapre le stesse istruzioni in overlay.
     Funziona solo se il sito accetta di essere incorporato. */

  const params = new URLSearchParams(location.search);
  const task = TASKS[params.get("task")] || TASKS[1];
  const url = params.get("url") || OVERRIDE_URL || task.url;

  document.title = task.title + " — Test di usabilità";

  const blocks = `<div class="scenario">${task.scenario}</div>` +
    task.activities.map((text, i) => `
      <section class="activity">
        <span class="tag">ATTIVITÀ ${i + 1}</span>
        <p>${text}</p>
      </section>`).join("");

  introCounter.textContent = task.counter;
  introTitle.textContent = task.title;
  introContent.innerHTML = blocks;
  panelCounter.textContent = task.counter;
  sheetTitle.textContent = task.title;
  panelContent.innerHTML = blocks;

  startBtn.addEventListener("click", () => {
    site.src = url;
    document.body.dataset.view = "test";
    fab.focus();
  });

  function setOpen(open) {
    sheet.hidden = !open;
    fab.setAttribute("aria-expanded", String(open));
    if (open) closeBtn.focus(); else fab.focus();
  }
  fab.addEventListener("click", () => setOpen(sheet.hidden));
  closeBtn.addEventListener("click", () => setOpen(false));
  backBtn.addEventListener("click", () => setOpen(false));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !sheet.hidden) setOpen(false);
  });
  </script>
</body>
</html>
